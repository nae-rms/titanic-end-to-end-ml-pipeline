[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-end-to-end-ml"
version = "0.1.0"
description = "End-to-end machine learning pipeline for Titanic survival prediction"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]